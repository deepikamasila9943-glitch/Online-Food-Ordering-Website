<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Online Food Ordering Website</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Website Header -->
    <header>
        <h1>Online Food Ordering</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#food">Food Menu</a>
            <a href="#cart">My Cart</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main id="home">

        <!-- Search Section -->
        <section>
            <h2>Find Your Favourite Food</h2>
            <input type="text" id="searchInput"
                   placeholder="Search food items...">
        </section>

        <!-- Category Section -->
        <section id="categories">
            <h2>Food Categories</h2>
            <button onclick="filterByCategory('All')">
                All
            </button>
            <button onclick="filterByCategory('Snacks')">
                Snacks
            </button>
            <button onclick="filterByCategory('Meals')">
                Meals
            </button>
        </section>

        <!-- Food Display Section -->
        <section id="food">
            <h2>Available Food Items</h2>
            <div id="foodContainer"></div>
        </section>

        <!-- Shopping Cart Section -->
        <section id="cart">
            <h2>Shopping Cart</h2>
            <div id="cartItems"></div>
            <h3 id="totalAmount">Total: ₹0</h3>

            <button onclick="submitOrder()">
                Submit Order
            </button>
        </section>

    </main>

    <!-- Website Footer -->
    <footer>
        <p>Online Food Ordering Website</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
